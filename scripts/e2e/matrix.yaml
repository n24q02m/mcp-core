# E2E test matrix — single source of truth for the 16-config 3-axis taxonomy.
#
# Axes:
#   - auth: none / oauth / relay
#   - interaction: non-interaction / interaction (encoded via tier)
#   - tier: t0-only / t2-non-interaction / t2-interaction / t3-staging
#
# Multi-user is a deployment property of remote mode (PUBLIC_URL env), not a
# config — single isolation test runs at mcp-core fixture level.
#
# Schema validated by tests/test_matrix.py.
#
# t3-staging tier (2026-04-28):
#   - notion-oauth: Notion app dashboard does not accept dynamic loopback
#     callbacks and Notion has no DCR. Path (a) "prod-stable callback +
#     tunnel" was selected so a single registered callback serves every
#     run. Release flow differs from the rest of the matrix:
#         release beta CD --> deploy to notion-mcp-staging.n24q02m.com
#         --> driver hits staging URL (callback prod-registered)
#         --> if staging E2E PASS, dispatch stable CD
#     Other MCPs (T2 configs) still run "test local --> release stable"
#     directly because their relay/device-code flows do not require an
#     out-of-band-registered callback.
#   - User directive (cfdeb529 2026-04-28): "Cập nhật matrix test để
#     riêng notion remote oauth sẽ phải release beta -> deploy
#     beta/staging -> test staging trước thay vì test local rồi release
#     stable luôn như các mcp server còn lại."
#   - See ``feedback_notion_oauth_staging_flow.md`` for the full rule.

version: 1
configs:
  # ============================================================
  # T0-only (CI/precommit, no upstream identity, 5 configs)
  # ============================================================

  - id: mcp-core-ci
    repo: mcp-core
    tier: t0-only
    auth: none
    test: "unit + integration"

  - id: qwen3-embed-ci
    repo: qwen3-embed
    tier: t0-only
    auth: none
    test: "tests (Modal worker stubs)"

  - id: web-core-ci
    repo: web-core
    tier: t0-only
    auth: none
    test: "build + lint"

  - id: claude-plugins-ci
    repo: claude-plugins
    tier: t0-only
    auth: none
    test: "skill validation"

  - id: godot-stub
    repo: better-godot-mcp
    tier: t0-only
    auth: none
    test: "stub mode (no exe required)"

  # ============================================================
  # T2 non-interaction (driver pre-fills relay form, 6 configs)
  # ============================================================

  - id: notion-paste-token
    repo: better-notion-mcp
    tier: t2-non-interaction
    auth: relay
    skret_namespace: /better-notion-mcp/prod
    # Driver POSTs the form field name from RELAY_SCHEMA (NOTION_TOKEN);
    # skret carries both NOTION_TOKEN + legacy NOTION_INTEGRATION_TOKEN
    # with the same value so older docs/tools keep working.
    skret_keys: [NOTION_TOKEN]

  - id: email-gmail
    repo: better-email-mcp
    tier: t2-non-interaction
    auth: relay
    skret_namespace: /better-email-mcp/prod
    # Email's relay form is JS-rendered (no static <input>) and POSTs a
    # single ``EMAIL_CREDENTIALS`` field with format
    # ``email1:pass1,email2:pass2``. skret stores the assembled string +
    # the legacy GMAIL_EMAIL/GMAIL_APP_PASSWORD pair under the same
    # namespace so older docs keep working.
    skret_keys: [EMAIL_CREDENTIALS, MCP_DCR_SERVER_SECRET]

  - id: telegram-bot
    repo: better-telegram-mcp
    tier: t2-non-interaction
    auth: relay
    skret_namespace: /better-telegram-mcp/prod
    skret_keys: [TELEGRAM_BOT_TOKEN, MCP_DCR_SERVER_SECRET]

  - id: crg
    repo: better-code-review-graph
    tier: t2-non-interaction
    auth: relay
    skret_namespace: /better-code-review-graph/prod
    skret_keys: [JINA_AI_API_KEY, GEMINI_API_KEY, OPENAI_API_KEY, COHERE_API_KEY, MCP_DCR_SERVER_SECRET]
    skret_optional: [JINA_AI_API_KEY, GEMINI_API_KEY, OPENAI_API_KEY, COHERE_API_KEY]

  - id: imagine
    repo: imagine-mcp
    tier: t2-non-interaction
    auth: relay
    skret_namespace: /imagine-mcp/prod
    skret_keys: [GEMINI_API_KEY, OPENAI_API_KEY, XAI_API_KEY, MCP_DCR_SERVER_SECRET]
    skret_optional: [GEMINI_API_KEY, OPENAI_API_KEY, XAI_API_KEY]

  - id: godot-with-exe
    repo: better-godot-mcp
    tier: t2-non-interaction
    auth: none
    requires_local_resource: "godot binary on PATH or GODOT_PATH env"

  # ============================================================
  # T2 interaction (driver fills, user clicks at upstream gate, 4 configs)
  # ============================================================

  - id: email-outlook
    repo: better-email-mcp
    tier: t2-interaction
    auth: relay
    flow: device-code
    # ``spawn-setup.ts:182`` routes outlook.com / hotmail.com / live.com
    # accounts through ``initiateOutlookDeviceCode`` — the server reads
    # the email from the relay form, identifies the Outlook domain via
    # ``isOutlookDomain``, and initiates Microsoft Device Code OAuth2.
    # HTTP mode is always multi-user: refresh token stored at
    # ``~/.better-email-mcp/tokens/<sub>.json`` (per JWT sub).
    # OUTLOOK_CLIENT_ID falls back to the bundled public Azure client at
    # ``oauth2.ts:88`` (d56f8c71-...) so no skret entry is required.
    skret_namespace: /better-email-mcp/prod
    skret_keys: [OUTLOOK_EMAIL, MCP_DCR_SERVER_SECRET]
    user_gate: "Click Microsoft device-code link"

  - id: telegram-user
    repo: better-telegram-mcp
    tier: t2-interaction
    auth: relay
    flow: browser-form
    # User mode (MTProto) requires phone -> OTP -> optional 2FA password,
    # all chained in the same /authorize form via next_step responses
    # (otp_required / password_required). The driver cannot fill OTP/2FA
    # server-to-server (they come from the user's phone, not skret), so
    # it announces the local /authorize URL and waits for the form to
    # navigate the browser into the local callback listener after the
    # multi-step exchange completes.
    skret_namespace: /better-telegram-mcp/prod
    skret_keys: [TELEGRAM_PHONE, MCP_DCR_SERVER_SECRET]
    user_gate: "Type OTP + 2FA password in browser"

  # wet-full / mnemo-full: relay form posts API keys (optional) + triggers
  # GDrive Device Code OAuth. HTTP mode is always multi-user (PUBLIC_URL
  # set, per-JWT-sub credential storage at
  # ``~/.<server>-mcp/subs/<sub>/tokens/google_drive.json`` -- wet-mcp
  # commit 52ec8da, mnemo-mcp commit b0b66e4 closes the cross-user
  # GDrive token leak gap from spec 2026-04-25 #134/#187).
  - id: wet-full
    repo: wet-mcp
    tier: t2-interaction
    auth: relay
    flow: device-code
    skret_namespace: /wet-mcp/prod
    skret_keys: [JINA_AI_API_KEY, GEMINI_API_KEY, OPENAI_API_KEY, COHERE_API_KEY, MCP_DCR_SERVER_SECRET]
    skret_optional: [JINA_AI_API_KEY, GEMINI_API_KEY, OPENAI_API_KEY, COHERE_API_KEY]
    user_gate: "Click GDrive device-code link"

  - id: mnemo-full
    repo: mnemo-mcp
    tier: t2-interaction
    auth: relay
    flow: device-code
    skret_namespace: /mnemo-mcp/prod
    skret_keys: [JINA_AI_API_KEY, GEMINI_API_KEY, OPENAI_API_KEY, COHERE_API_KEY, MCP_DCR_SERVER_SECRET]
    skret_optional: [JINA_AI_API_KEY, GEMINI_API_KEY, OPENAI_API_KEY, COHERE_API_KEY]
    user_gate: "Click GDrive device-code link"

  # ============================================================
  # T3 staging (notion-oauth — beta deploy -> staging E2E gate, 1 config)
  # ============================================================

  - id: notion-oauth
    repo: better-notion-mcp
    tier: t3-staging
    auth: oauth
    flow: oauth-redirect
    # No local Docker spin-up; driver hits the staging URL directly. The
    # Notion app dashboard has the staging callback prod-registered:
    #     redirect_uri = https://notion-mcp-staging.n24q02m.com/auth/callback
    # Driver flow:
    #   1. CI/CD just dispatched ``release beta`` -> staging redeployed.
    #   2. Driver opens upstream Notion ``/oauth/authorize?...&state=<x>``
    #      -> announces URL via user_gate.
    #   3. User clicks "Allow" -> Notion redirects to staging callback.
    #   4. Staging exchanges code -> JWT -> driver retrieves JWT via
    #      ``acquire_jwt_via_upstream_consent`` against the staging URL.
    #   5. PASS -> dispatch stable CD; FAIL -> investigate before stable.
    deployment: [staging]
    staging_url: https://notion-mcp-staging.n24q02m.com
    user_gate: "Click 'Allow' on the Notion consent screen"

  # ============================================================
  # stdio-direct (Task 6 — drives plugin via Python MCP SDK
  # ``stdio_client`` instead of HTTP. One per default-stdio
  # Python plugin. Tier-less: this is a parallel axis verifying
  # that the plugin's stdio entry point loads tools without an
  # HTTP daemon. Tools are listed via ``tools/list`` over stdio
  # and asserted ``>= expected_tools_min`` (uses the matrix-wide
  # N+2 layout where N domain tools + ``config`` + ``help``;
  # ``expected_tools_min`` here counts only domain tools, since
  # the +2 are guaranteed by the standard).
  # ============================================================

  - id: wet-stdio-direct
    type: stdio-direct
    repo: wet-mcp
    plugin: wet-mcp
    cmd: ["uvx", "--python", "3.13", "--prerelease=allow", "--from", "wet-mcp==2.29.0b3", "wet-mcp"]
    env: {MCP_TRANSPORT: stdio}
    expected_tools_min: 5

  - id: mnemo-stdio-direct
    type: stdio-direct
    repo: mnemo-mcp
    plugin: mnemo-mcp
    cmd: ["uvx", "--python", "3.13", "--prerelease=allow", "--from", "mnemo-mcp==1.25.0b3", "mnemo-mcp"]
    env: {MCP_TRANSPORT: stdio}
    expected_tools_min: 3

  - id: crg-stdio-direct
    type: stdio-direct
    repo: better-code-review-graph
    plugin: better-code-review-graph
    cmd: ["uvx", "--python", "3.13", "--prerelease=allow", "--from", "better-code-review-graph==3.13.0b4", "better-code-review-graph"]
    env: {MCP_TRANSPORT: stdio}
    expected_tools_min: 4

  - id: imagine-stdio-direct
    type: stdio-direct
    repo: imagine-mcp
    plugin: imagine-mcp
    cmd: ["uvx", "--python", "3.13", "--prerelease=allow", "--from", "imagine-mcp==1.2.0b2", "imagine-mcp"]
    env: {MCP_TRANSPORT: stdio}
    expected_tools_min: 3

  - id: telegram-stdio-direct
    type: stdio-direct
    repo: better-telegram-mcp
    plugin: better-telegram-mcp
    cmd: ["uvx", "--python", "3.13", "--prerelease=allow", "--from", "better-telegram-mcp==4.9.0b4", "better-telegram-mcp"]
    env: {MCP_TRANSPORT: stdio}
    expected_tools_min: 5

  # ============================================================
  # T2 stdio direct (added 2026-05-02 per spec
  # ``2026-05-01-stdio-pure-http-multiuser.md`` §5.5.3).
  # These configs go beyond the parallel-axis ``stdio-direct`` smoke
  # tests above: they pull credentials from skret per-plugin namespace,
  # spawn ``uvx <plugin>`` with env, run the standard MCP handshake,
  # AND invoke a representative ``tools/call`` to verify the stdio
  # entry point can serve real workloads (not just list tool names).
  # 8 plugins + 1 negative + 2 multi-session invariant = 11 entries.
  # ============================================================

  - id: notion-stdio
    repo: better-notion-mcp
    tier: t2-non-interaction
    auth: env
    skret_namespace: /better-notion-mcp/prod
    skret_keys: [NOTION_TOKEN]
    test: "uvx + env -> init -> tools/call (workspace info)"

  - id: email-stdio-gmail
    repo: better-email-mcp
    tier: t2-non-interaction
    auth: env
    skret_namespace: /better-email-mcp/prod
    skret_keys: [EMAIL_PROVIDER, EMAIL_USER, EMAIL_APP_PASSWORD]
    test: "uvx + env -> init -> tools/call (folders.list)"

  - id: telegram-stdio-bot
    repo: better-telegram-mcp
    tier: t2-non-interaction
    auth: env
    skret_namespace: /better-telegram-mcp/prod
    skret_keys: [TELEGRAM_BOT_TOKEN]
    test: "uvx + env -> init -> tools/call (chat.list)"

  - id: wet-stdio
    repo: wet-mcp
    tier: t2-non-interaction
    auth: env
    skret_namespace: /wet-mcp/prod
    skret_keys: [BRAVE_API_KEY]
    skret_optional: [BRAVE_API_KEY]
    test: "uvx + env -> init -> search action"

  - id: mnemo-stdio
    repo: mnemo-mcp
    tier: t2-non-interaction
    auth: none
    test: "uvx -> init -> memory store/recall"

  - id: crg-stdio
    repo: better-code-review-graph
    tier: t2-non-interaction
    auth: env
    skret_namespace: /better-code-review-graph/prod
    skret_keys: [GEMINI_API_KEY]
    skret_optional: [GEMINI_API_KEY]
    test: "uvx -> init -> graph build"

  - id: imagine-stdio
    repo: imagine-mcp
    tier: t2-non-interaction
    auth: env
    skret_namespace: /imagine-mcp/prod
    skret_keys: [GEMINI_API_KEY]
    test: "uvx + env -> init -> understand action"

  - id: godot-stdio
    repo: better-godot-mcp
    tier: t2-non-interaction
    auth: none
    test: "uvx -> init -> version"

  - id: stdio-no-env-negative
    repo: all
    tier: t2-non-interaction
    auth: none
    test: "uvx without required env -> assert exit 1 + stderr message format match"

  # ============================================================
  # Multi-session spawn invariants (added 2026-05-02 per spec §5.5.3).
  # Stdio mode: N CC sessions => N independent processes (no shared
  # state). HTTP mode: N CC sessions => 1 shared daemon (multi-user
  # JWT-sub state). These invariants are the runtime contract for
  # the stdio-pure / http-multi-user architecture.
  # ============================================================

  - id: multi-session-stdio
    repo: all
    tier: t2-non-interaction
    auth: env
    test: "Spawn 3 concurrent stdio processes per plugin -> assert >=3 distinct PIDs (no sharing)"

  - id: multi-session-http
    repo: all
    tier: t2-non-interaction
    auth: env
    test: "Spawn 3 concurrent HTTP-mode CC sessions -> assert exactly 1 daemon PID"
