[project]
name = "mcp-e2e-driver"
version = "0.1.0"
requires-python = "==3.13.*"
description = "E2E test driver for the MCP server stack (mcp-core + 8 MCPs)"
dependencies = [
    "httpx>=0.28.1",
    # botocore[crt] required so boto3 can use the ``aws login`` credential
    # provider on hosts authenticated via SSO/identity center. Without crt
    # SSM client raises MissingDependencyException at first call.
    "boto3>=1.43.51",
    "botocore[crt]>=1.43.51",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    # Capped at the major: this driver drives the SDK's transport internals
    # (client factory, stream tuple shape, auth plumbing), all of which moved
    # in 2.0. Without a ceiling a lock refresh pulls the next major in and the
    # E2E job dies on an ImportError with nothing in the diff to explain it --
    # exactly what happened on 2026-07-31. The other pins here ride on stable
    # public surface and need no ceiling.
    "mcp>=2.0.0,<3",
    # Imported directly by client_runner. It is the transport's HTTP layer and
    # a different package from httpx, which the rest of the driver still uses.
    "httpx2>=2.9.1,<3",
    "starlette>=1.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v"
pythonpath = [".."]
