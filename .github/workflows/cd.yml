name: CD

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Semantic Release (version bump, CHANGELOG, tag, GitHub Release)
  # ============================================================================
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Dry-run PSR (no_operation_mode => --noop: no commit/tag/push/release) purely to
      # learn the version it WOULD publish, so the collision guard below can fire BEFORE
      # the real run creates a git tag or GitHub Release. Same action + SHA and same
      # config_file/prerelease inputs as the real step, run against the same untouched
      # checkout, so the computed version is identical.
      # semgrep: @v1 is an intentional moving major tag on a first-party fork action (fork-velocity + instant fleet hotfixes)
      - uses: n24q02m/better-semantic-release@95d056deb7b7edcf6b4be69536aec70624355333 # v1.2.1
        id: dryrun
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          config_file: semantic-release.toml
          prerelease: ${{ inputs.release_type == 'beta' }}
          prerelease_token: beta
          no_operation_mode: true

      # PSR silently no-ops when it can't find a fix:/feat: commit since the last
      # tag -- e.g. a bot PR squash-merged with a non-conventional subject (the
      # commit-title no-bump trap the pr-title CI check guards at merge time; this
      # step is the release-time backstop for anything that slipped past it, or a
      # repo predating that check). released=false alone is not an error (it is
      # the normal outcome of a docs-only/chore-only window), so this only warns.
      - name: Warn if commits exist since last tag but PSR computed no release
        if: steps.dryrun.outputs.released != 'true'
        run: |
          set -uo pipefail
          highest_tag="$(git tag -l 'v*' | sort -V | tail -1)"
          if [ -z "$highest_tag" ]; then
            echo "No existing tags -- nothing to compare."
            exit 0
          fi
          commit_count="$(git rev-list "${highest_tag}..HEAD" --count)"
          if [ "$commit_count" -gt 0 ]; then
            echo "::warning::PSR computed no release (released=false) but ${commit_count} commit(s) exist since ${highest_tag}. This is expected if they are all chore/docs-only, but if one of them should have bumped the version (e.g. a bot-authored fix squashed with a non-conventional subject), inspect 'git log ${highest_tag}..HEAD --oneline' before assuming there is nothing to release."
          else
            echo "OK: no commits since ${highest_tag} -- released=false is expected."
          fi

      # All 3 published coordinates (npm core-ts, PyPI core-py, PyPI embedding-daemon)
      # share the SAME PSR-computed version, but a version can be free on one registry
      # and already taken on another -- so all 3 are checked, and this fails if ANY of
      # them reports a collision or an unknown/unreachable result. Neither registry ever
      # allows reusing a version number, so a hit here means git history has diverged
      # from what was actually published; this fires before any tag or Release is
      # created, converting a silent release freeze (PSR sees a matching tag, sets
      # released=false, every publish job is skipped) or an opaque upload failure deep
      # in `npm publish`/`uv publish` into one explicit, actionable error.
      - name: Guard against re-publishing an already-published version
        if: steps.dryrun.outputs.released == 'true'
        env:
          COMPUTED_VERSION: ${{ steps.dryrun.outputs.version }}
        run: |
          set -uo pipefail
          FAILED=0

          # PyPI probe: normalizes the version in the URL path (e.g. 1.2.3-beta.1 and
          # 1.2.3b1 both resolve to the same release), so PSR's raw version output can
          # be used directly.
          #   200            -> exists         -> COLLISION
          #   404             -> not found      -> FREE
          #   anything else  -> network/registry error -> UNKNOWN, never treated as free
          check_pypi() {
            local pkg="$1"
            local url="https://pypi.org/pypi/${pkg}/${COMPUTED_VERSION}/json"
            echo "Checking PyPI for ${pkg} ${COMPUTED_VERSION}..."
            local http_code
            http_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url")
            if [ "$http_code" = "200" ]; then
              echo "::error::Computed release version ${COMPUTED_VERSION} already exists on PyPI as ${pkg}==${COMPUTED_VERSION}. PyPI NEVER allows re-publishing a version number, even one later yanked. This almost always means the git history diverged from what was actually published to PyPI. Do NOT retry the same version: bump PAST the already-published range (higher than any version ever published) and dispatch the release again."
              return 1
            fi
            if [ "$http_code" = "404" ]; then
              echo "OK: ${pkg}==${COMPUTED_VERSION} is not on PyPI (404) -- safe to publish."
              return 0
            fi
            echo "::error::Could not verify whether ${pkg}==${COMPUTED_VERSION} exists on PyPI: unexpected HTTP status ${http_code} from ${url} (likely a transient network/registry error, rate limit, or outage). Refusing to proceed so a genuine collision cannot slip through as a false 'free'."
            return 1
          }

          # npm probe (unauthenticated `npm view` against the live registry):
          #   version exists        -> exit 0, prints the version on stdout  => COLLISION
          #   version/package 404   -> exit non-zero, output contains 'E404' => FREE
          #   network/registry error-> exit non-zero, output has NO 'E404'   => UNKNOWN
          check_npm() {
            local pkg="$1"
            echo "Checking npm for ${pkg}@${COMPUTED_VERSION}..."
            local output status
            if output="$(npm view "${pkg}@${COMPUTED_VERSION}" version 2>&1)"; then
              status=0
            else
              status=$?
            fi
            if [ "${status}" -eq 0 ] && [ -n "${output}" ]; then
              echo "::error::Computed release version ${COMPUTED_VERSION} already exists on npm as ${pkg}@${COMPUTED_VERSION}. npm NEVER allows re-publishing a version number, even one later unpublished or deprecated. This almost always means the git history diverged from what was actually published to npm. Do NOT retry the same version: bump PAST the already-published range (higher than any version ever published) and dispatch the release again."
              return 1
            fi
            if printf '%s\n' "${output}" | grep -q 'E404'; then
              echo "OK: ${pkg}@${COMPUTED_VERSION} is not on npm (E404) -- safe to publish."
              return 0
            fi
            echo "::error::Could not verify whether ${pkg}@${COMPUTED_VERSION} exists on npm: 'npm view' failed without an E404 (likely a transient registry/network error, rate limit, or outage). Refusing to proceed so a genuine collision cannot slip through as a false 'free'. npm output: ${output}"
            return 1
          }

          check_npm '@n24q02m/mcp-core' || FAILED=1
          check_pypi 'n24q02m-mcp-core' || FAILED=1
          check_pypi 'mcp-embedding-daemon' || FAILED=1

          exit "$FAILED"

      # semgrep: @v1 is an intentional moving major tag on a first-party fork action (fork-velocity + instant fleet hotfixes)
      - uses: n24q02m/better-semantic-release@95d056deb7b7edcf6b4be69536aec70624355333 # v1.2.1
        id: release
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          config_file: semantic-release.toml
          prerelease: ${{ inputs.release_type == 'beta' }}
          prerelease_token: beta

      - uses: python-semantic-release/publish-action@5a5718ce47b892ef699f2972dae122297771d641 # v10.6.1
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          tag: ${{ steps.release.outputs.tag }}

  # ============================================================================
  # Publish TypeScript package (core-ts) to npm
  # ============================================================================
  publish-npm:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      - name: Inject version from PSR into package.json
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          for pkg in packages/core-ts; do
            node -e "const f='$pkg/package.json'; const p=require('./'+f); p.version='$VERSION'; require('fs').writeFileSync(f, JSON.stringify(p, null, 2)+'\n')"
            echo "Set $pkg version to $VERSION"
          done

      - name: Build and publish core-ts
        run: |
          cd packages/core-ts && bun run build
          # package.json lists README.md in `files`, but core-ts has none of its
          # own -- without this the tarball ships without one and npmjs.com shows
          # "This package does not have a README" (the PyPI job already does this).
          cp ../../README.md .
          # Fail loudly rather than publish a package page that reads
          # "This package does not have a README" to its ~2.5k weekly installs.
          npm pack --dry-run --json | grep -q '"path": *"README.md"' \
            || { echo "::error::README.md missing from the npm tarball -- refusing to publish"; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          if npm view @n24q02m/mcp-core@"$VERSION" version 2>/dev/null; then
            echo "core-ts@$VERSION already published, skipping"
          else
            TAG=${{ needs.release.outputs.is_prerelease == 'true' && 'beta' || 'latest' }}
            npm publish --provenance --access public --no-git-checks --tag "$TAG"
          fi

  # ============================================================================
  # Publish Python packages to PyPI
  # ============================================================================
  publish-pypi:
    name: Publish to PyPI (${{ matrix.package }})
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: [core-py, embedding-daemon]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Build and publish
        working-directory: packages/${{ matrix.package }}
        run: |
          cp ../../README.md .
          uv build
          uv publish

  # ============================================================================
  # Auto-create tracking issues in downstream repos (stable releases only)
  # ============================================================================
  create-downstream-issues:
    name: Create downstream bump issues
    needs: [release, publish-npm, publish-pypi]
    if: needs.release.outputs.released == 'true' && needs.release.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
          owner: n24q02m
          repositories: >-
            better-notion-mcp,better-email-mcp,better-telegram-mcp,
            wet-mcp,mnemo-mcp,better-code-review-graph,better-godot-mcp,
            imagine-mcp

      - name: Create issues in downstream repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          TS_DOWNSTREAM="better-notion-mcp better-email-mcp better-godot-mcp"
          PY_DOWNSTREAM="better-telegram-mcp wet-mcp mnemo-mcp better-code-review-graph imagine-mcp"
          CHANGELOG_URL="https://github.com/n24q02m/mcp-core/releases/tag/${TAG}"

          create_issue() {
            local repo="$1"
            local pkg_name="$2"
            local title="chore: bump ${pkg_name} to ${VERSION}"
            local body
            body=$(cat <<EOF
          mcp-core released stable **${TAG}**.

          **Changelog:** ${CHANGELOG_URL}

          ## Action required

          Bump the \`${pkg_name}\` pin in this repo and regenerate lockfile:

          - TypeScript: update \`@n24q02m/mcp-core\` in \`package.json\` → \`bun install\`
          - Python: update \`n24q02m-mcp-core\` in \`pyproject.toml\` → \`uv lock\`

          Then open a PR with title \`fix: bump mcp-core to ${VERSION}\`.

          _Auto-created by mcp-core CD. See \`feedback_core_release_auto_issue.md\`._
          EOF
          )

            existing=$(gh issue list -R "n24q02m/${repo}" --search "in:title \"bump ${pkg_name} to ${VERSION}\"" --state all --json number --jq '.[0].number // ""')
            if [ -n "$existing" ]; then
              echo "::notice::Issue already exists in ${repo}: #${existing}"
              return 0
            fi
            gh issue create -R "n24q02m/${repo}" --title "$title" --body "$body" --label "dependencies" || \
              gh issue create -R "n24q02m/${repo}" --title "$title" --body "$body"
          }

          for repo in $TS_DOWNSTREAM; do
            create_issue "$repo" "@n24q02m/mcp-core" || echo "::warning::Failed to create issue in $repo"
          done
          for repo in $PY_DOWNSTREAM; do
            create_issue "$repo" "n24q02m-mcp-core" || echo "::warning::Failed to create issue in $repo"
          done
