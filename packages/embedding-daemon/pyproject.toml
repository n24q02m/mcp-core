[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-embedding-daemon"
version = "1.23.2"
description = "Shared ONNX/GGUF embedding server for the n24q02m MCP ecosystem"
readme = "README.md"
requires-python = "==3.13.*"
license = { text = "Apache-2.0" }
authors = [{ name = "n24q02m", email = "quangminh2422004@gmail.com" }]
keywords = ["mcp", "embedding", "onnx", "gguf", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "onnxruntime>=1.29.0",
    "numpy>=2.5.2",
    "httpx>=0.28.1",
    # Keep this a RANGE, never an exact pin: this package is published to PyPI,
    # so an `==` here would force every consumer onto that one pydantic build.
    # The ceiling is <3, same as core-py. It used to be <2.13 so downstream
    # consumers on cohere>=6.1.0 could resolve — cohere 6.1.0 capped
    # pydantic-core <2.44.0 while pydantic 2.13.x ships pydantic-core 2.46+.
    # That reason is gone: cohere 7.x caps pydantic-core <3.0.0, and the stack
    # no longer depends on the cohere SDK directly.
    "pydantic>=2.12.5,<3",
]

[project.optional-dependencies]
# `gguf` extra is intentionally empty for v1.x: the GGUF backend is a stub
# (see src/mcp_embedding_daemon/backends/gguf.py). Pulling `llama-cpp-python`
# in eagerly drags the unmaintained `diskcache` package (CVE-2025-69872, no
# upstream patch) into the lock without any code path actually using it.
# Re-add the dep (and gate `LlamaDiskCache` behind a JSON/msgpack alternative
# or runtime opt-in) when the GGUF backend lands.
gguf = []
cuda = ["onnxruntime-gpu>=1.29.0"]

[project.urls]
Homepage = "https://github.com/n24q02m/mcp-core"
Repository = "https://github.com/n24q02m/mcp-core"
Issues = "https://github.com/n24q02m/mcp-core/issues"

[project.scripts]
mcp-embedding-daemon = "mcp_embedding_daemon.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "ty>=0.0.75",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_embedding_daemon"]

[tool.ruff]
line-length = 120
target-version = "py313"

# Ruff's default rule set is not a stable contract across releases: 0.16.0
# widened it and lint started failing with no code change. Select the rules
# explicitly so a ruff upgrade can never silently change what is enforced.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# 0.16.0 also promoted formatting of Python code blocks inside Markdown out of
# preview. This repo has never formatted Markdown, so opt out explicitly rather
# than inherit the new default — adopting it is a separate decision.
[tool.ruff.format]
exclude = ["*.md"]
