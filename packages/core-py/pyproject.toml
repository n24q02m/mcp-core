[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n24q02m-mcp-core"
version = "1.17.3"
description = "Unified MCP Streamable HTTP 2025-11-25 transport, OAuth 2.1 AS, lifecycle, install"
readme = "README.md"
requires-python = "==3.13.*"
license = { text = "MIT" }
authors = [{ name = "n24q02m", email = "quangminh2422004@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "streamable-http", "oauth21", "transport"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
    "cryptography>=48.0.0",
    "authlib>=1.7.2",
    "starlette>=1.2.1",
    # Pydantic kept open >=2.12.5,<3 so downstream plugins (telegram/imagine/
    # wet/mnemo) can resolve to whatever pydantic version Renovate bumped them
    # to. mcp-core itself only uses stable 2.9+ surface — no 2.13 lock-in.
    # Earlier cap to <2.13 was to humour cohere's pydantic-core pin, but that
    # is downstream-only and should not block plugins that don't use cohere.
    "pydantic>=2.12.5,<3",
    "loguru>=0.7.3",
    "platformdirs>=4.10.0",
    "tomli-w>=1.2.0",
    "filelock>=3.29.1",
]

[project.urls]
Homepage = "https://github.com/n24q02m/mcp-core"
Repository = "https://github.com/n24q02m/mcp-core"
Issues = "https://github.com/n24q02m/mcp-core/issues"

[project.scripts]
mcp-clean-state = "mcp_core.scripts.clean_state:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_core"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty.rules]
unresolved-attribute = "ignore"
possibly-missing-attribute = "ignore"
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
