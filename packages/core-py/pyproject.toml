[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n24q02m-mcp-core"
version = "1.23.1"
description = "Unified MCP Streamable HTTP 2025-11-25 transport, OAuth 2.1 AS, lifecycle, install"
readme = "README.md"
requires-python = "==3.13.*"
license = { text = "Apache-2.0" }
authors = [{ name = "n24q02m", email = "quangminh2422004@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "streamable-http", "oauth21", "transport"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "httpcore>=1.0.9",
    "cryptography>=50.0.0",
    "authlib>=1.7.2",
    "starlette>=1.6.0",
    # Pydantic kept open >=2.12.5,<3 so downstream plugins (telegram/imagine/
    # wet/mnemo) can resolve to whatever pydantic version Renovate bumped them
    # to. mcp-core itself only uses stable 2.9+ surface — no 2.13 lock-in.
    # Earlier cap to <2.13 was to humour cohere's pydantic-core pin, but that
    # is downstream-only and should not block plugins that don't use cohere.
    # Must stay a range: this is a published library, so an exact `==` pin here
    # propagates to every consumer's resolve.
    "pydantic>=2.12.5,<3",
    # pydantic-settings 2.15 warns when MCP SDK Settings resolves its lifespan
    # forward reference. Keep the transitive runtime warning-free until upstream
    # rebuilds that model; this bound also protects downstream MCP servers.
    "pydantic-settings>=2.14.2,<2.15",
    "loguru>=0.7.3",
    "platformdirs>=4.11.3",
    "tomli-w>=1.2.0",
    "filelock>=3.32.4",
]

[project.optional-dependencies]
# litellm>=1.83.0: CVE-2026-35030 fixed in 1.83.0; 1.82.7-1.82.8 were removed
# from PyPI (supply-chain incident). Library mode only — NEVER litellm[proxy].
llm = ["litellm>=1.98.0"]

[project.urls]
Homepage = "https://github.com/n24q02m/mcp-core"
Repository = "https://github.com/n24q02m/mcp-core"
Issues = "https://github.com/n24q02m/mcp-core/issues"

[project.scripts]
mcp-clean-state = "mcp_core.scripts.clean_state:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.4",
    "telethon>=1.44.0",
    "ty>=0.0.75",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_core"]

[tool.ruff]
line-length = 120
target-version = "py313"

# Ruff's default rule set is not a stable contract across releases: 0.16.0
# widened it and lint started failing with no code change. Select the rules
# explicitly so a ruff upgrade can never silently change what is enforced.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# 0.16.0 also promoted formatting of Python code blocks inside Markdown out of
# preview. This repo has never formatted Markdown, so opt out explicitly rather
# than inherit the new default — adopting it is a separate decision.
[tool.ruff.format]
exclude = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty.rules]
unresolved-attribute = "ignore"
possibly-missing-attribute = "ignore"
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
